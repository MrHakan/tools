<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Entity Converter — Bench</title>
<meta name="description" content="Escape text into HTML entities and decode entities back, with a searchable symbol reference.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314211f'/%3E%3Cpath d='M6 6h9v20H6zM17 6h9v20h-9z' fill='%23e0521a' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/css/bench.css">
<style>
  /* Page-specific CSS only, prefixed .he */
  .he__opts { margin-bottom: var(--gap); }

  .he__swap {
    flex: none;
    width: 34px;
    height: 34px;
    padding: 0;
    font-size: 16px;
  }

  .he__ref { max-height: 440px; overflow-y: auto; }

  .he__ch {
    font-size: 15px;
    display: inline-block;
    min-width: 1.4em;
  }

  .he__ch--blank {
    color: var(--steel);
    font-size: 12px;
  }

  .he__cell { cursor: copy; }
  .he__cell:hover { color: var(--signal); }

  .he__count { font-size: 12px; color: var(--steel); margin-top: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar__home" href="../../index.html"><span class="topbar__mark">▚</span> bench</a>
  <span class="topbar__sep">/</span>
  <span class="topbar__here">HTML Entity Converter</span>
  <button class="topbar__theme" data-theme-toggle aria-label="Switch colour theme">◐</button>
</header>

<main class="wrap">

  <div class="toolhead">
    <p class="toolhead__spec mono">&amp;amp; &amp;lt; &amp;#169;</p>
    <h1 class="toolhead__title">HTML Entity Converter</h1>
    <p class="toolhead__desc">Escape text into HTML entities and decode entities back, with a searchable symbol reference.</p>
  </div>

  <section class="panel he__opts">
    <h2 class="panel__title">Options</h2>
    <div class="row row--between">
      <div class="row">
        <label class="check"><input type="checkbox" id="opt-all"> Escape all non-ASCII characters too</label>
        <label class="sr-only" for="opt-style">Entity style</label>
        <select class="select" id="opt-style" style="width:auto">
          <option value="named">Named — &amp;eacute;</option>
          <option value="decimal">Decimal — &amp;#233;</option>
          <option value="hex">Hex — &amp;#xe9;</option>
        </select>
      </div>
      <button class="btn btn--sm he__swap" id="swap" aria-label="Swap the two boxes">⇅</button>
    </div>
  </section>

  <div class="split">

    <section class="panel">
      <h2 class="panel__title">Plain text</h2>
      <label class="sr-only" for="plain">Plain text</label>
      <textarea class="textarea textarea--prose" id="plain" spellcheck="false" placeholder="Type text here — it will be escaped on the right"></textarea>
      <p class="he__count" id="plain-count"></p>
    </section>

    <section class="panel">
      <h2 class="panel__title">HTML entities</h2>
      <label class="sr-only" for="entities">HTML entities</label>
      <textarea class="textarea textarea--prose" id="entities" spellcheck="false" placeholder="Or paste entities here — they will be decoded on the left"></textarea>
      <p class="he__count" id="entities-count"></p>
    </section>

  </div>

  <section class="panel" style="margin-top:var(--gap)">
    <h2 class="panel__title">Symbol reference</h2>
    <div class="field">
      <label class="sr-only" for="search">Search entities</label>
      <input class="input" id="search" type="text" placeholder="Search by name, character or codepoint — try &quot;arrow&quot;, &quot;euro&quot;, &quot;greek&quot;">
    </div>
    <div class="tablewrap he__ref">
      <table class="table">
        <thead>
          <tr><th>Character</th><th>Name</th><th>Decimal</th><th>Hex</th></tr>
        </thead>
        <tbody id="ref-body"></tbody>
      </table>
    </div>
    <p class="he__count" id="ref-count"></p>
  </section>

  <footer class="foot">
    <a href="../../index.html">← All tools</a>
    <span>·</span>
    <span>Runs entirely in your browser</span>
  </footer>

</main>

<script src="../../assets/js/bench.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var $ = Bench.$, esc = Bench.esc;

  var plain = $("#plain"), entities = $("#entities");
  var optAll = $("#opt-all"), optStyle = $("#opt-style");
  var searchBox = $("#search"), refBody = $("#ref-body"), refCount = $("#ref-count");
  var plainCount = $("#plain-count"), entitiesCount = $("#entities-count");

  var SAMPLE = "Ben & Jerry's <ice cream> shop — “best” café menu © 2026";

  /* --- reference data --------------------------------------------------------
     ~90 common named entities across the categories the spec asks for.
     Each row's decimal/hex are derived from the character at render time so
     there is exactly one source of truth. --------------------------------- */

  var ENTITIES = [
    ["&", "amp", "Punctuation"], ["<", "lt", "Punctuation"], [">", "gt", "Punctuation"],
    ['"', "quot", "Punctuation"], ["'", "apos", "Punctuation"],
    ["©", "copy", "Punctuation"], ["®", "reg", "Punctuation"], ["™", "trade", "Punctuation"],
    ["°", "deg", "Punctuation"], ["§", "sect", "Punctuation"], ["¶", "para", "Punctuation"],
    ["·", "middot", "Punctuation"], ["…", "hellip", "Punctuation"], ["—", "mdash", "Punctuation"],
    ["–", "ndash", "Punctuation"], ["‘", "lsquo", "Punctuation"], ["’", "rsquo", "Punctuation"],
    ["“", "ldquo", "Punctuation"], ["”", "rdquo", "Punctuation"], ["«", "laquo", "Punctuation"],
    ["»", "raquo", "Punctuation"], ["•", "bull", "Punctuation"], [" ", "nbsp", "Punctuation"],
    ["†", "dagger", "Punctuation"], ["‡", "Dagger", "Punctuation"],

    ["¢", "cent", "Currency"], ["£", "pound", "Currency"], ["¤", "curren", "Currency"],
    ["¥", "yen", "Currency"], ["€", "euro", "Currency"],

    ["±", "plusmn", "Math"], ["×", "times", "Math"], ["÷", "divide", "Math"],
    ["½", "frac12", "Math"], ["¼", "frac14", "Math"], ["¾", "frac34", "Math"],
    ["¹", "sup1", "Math"], ["²", "sup2", "Math"], ["³", "sup3", "Math"],
    ["≠", "ne", "Math"], ["≤", "le", "Math"], ["≥", "ge", "Math"],
    ["∞", "infin", "Math"], ["∑", "sum", "Math"], ["∏", "prod", "Math"],
    ["√", "radic", "Math"], ["∀", "forall", "Math"], ["∃", "exist", "Math"],
    ["∈", "isin", "Math"], ["∩", "cap", "Math"], ["∪", "cup", "Math"],
    ["∧", "and", "Math"], ["∨", "or", "Math"], ["¬", "not", "Math"],

    ["←", "larr", "Arrows"], ["↑", "uarr", "Arrows"], ["→", "rarr", "Arrows"],
    ["↓", "darr", "Arrows"], ["↔", "harr", "Arrows"], ["↵", "crarr", "Arrows"],
    ["⇐", "lArr", "Arrows"], ["⇒", "rArr", "Arrows"], ["⇔", "hArr", "Arrows"],

    ["Á", "Aacute", "Accented letters"], ["á", "aacute", "Accented letters"],
    ["É", "Eacute", "Accented letters"], ["é", "eacute", "Accented letters"],
    ["Í", "Iacute", "Accented letters"], ["í", "iacute", "Accented letters"],
    ["Ó", "Oacute", "Accented letters"], ["ó", "oacute", "Accented letters"],
    ["Ú", "Uacute", "Accented letters"], ["ú", "uacute", "Accented letters"],
    ["Ñ", "Ntilde", "Accented letters"], ["ñ", "ntilde", "Accented letters"],
    ["Ç", "Ccedil", "Accented letters"], ["ç", "ccedil", "Accented letters"],
    ["Ü", "Uuml", "Accented letters"], ["ü", "uuml", "Accented letters"],
    ["Ö", "Ouml", "Accented letters"], ["ö", "ouml", "Accented letters"],
    ["Æ", "AElig", "Accented letters"], ["æ", "aelig", "Accented letters"],
    ["ß", "szlig", "Accented letters"],

    ["Α", "Alpha", "Greek"], ["α", "alpha", "Greek"], ["Β", "Beta", "Greek"], ["β", "beta", "Greek"],
    ["Γ", "Gamma", "Greek"], ["γ", "gamma", "Greek"], ["Δ", "Delta", "Greek"], ["δ", "delta", "Greek"],
    ["θ", "theta", "Greek"], ["λ", "lambda", "Greek"], ["μ", "mu", "Greek"],
    ["Π", "Pi", "Greek"], ["π", "pi", "Greek"], ["Σ", "Sigma", "Greek"], ["σ", "sigma", "Greek"],
    ["φ", "phi", "Greek"], ["ψ", "psi", "Greek"], ["Ω", "Omega", "Greek"], ["ω", "omega", "Greek"]
  ].map(function (row) {
    var cp = row[0].codePointAt(0);
    return { c: row[0], n: row[1], cat: row[2], dec: cp, hex: cp.toString(16) };
  });

  // Lookup for escaping: codepoint -> preferred name.
  var NAMED_MAP = {};
  ENTITIES.forEach(function (e) { if (NAMED_MAP[e.dec] === undefined) NAMED_MAP[e.dec] = e.n; });

  var REQUIRED = { 38: 1, 60: 1, 62: 1, 34: 1, 39: 1 }; // & < > " '

  /* --- escaping --------------------------------------------------------- */

  function escapeChar(cp, style) {
    if (style === "hex") return "&#x" + cp.toString(16) + ";";
    if (style === "decimal") return "&#" + cp + ";";
    var name = NAMED_MAP[cp];
    return name ? "&" + name + ";" : "&#" + cp + ";";
  }

  function escapeText(str, opts) {
    var out = "";
    // Array.from splits on codepoints, not UTF-16 code units, so surrogate
    // pairs (emoji, etc.) are handled as one character each.
    Array.from(str).forEach(function (ch) {
      var cp = ch.codePointAt(0);
      if (REQUIRED[cp] || (opts.all && cp > 127)) out += escapeChar(cp, opts.style);
      else out += ch;
    });
    return out;
  }

  /* --- decoding ------------------------------------------------------------
     Assigning to a detached textarea's innerHTML puts the browser's own HTML
     parser in RCDATA mode for that content: character references (named,
     &#NNN; and &#xHH;) are decoded, but "<" and ">" are kept as literal text
     rather than parsed into elements — so this never executes anything, and
     reading .value back is exactly the "decode entities" we want. -------- */

  function decodeEntities(str) {
    var ta = document.createElement("textarea");
    ta.innerHTML = str;
    return ta.value;
  }

  /* --- syncing the two boxes ---------------------------------------------- */

  function opts() { return { all: optAll.checked, style: optStyle.value }; }

  function fromPlain() {
    entities.value = escapeText(plain.value, opts());
    updateCounts();
  }

  function fromEntities() {
    plain.value = decodeEntities(entities.value);
    updateCounts();
  }

  function updateCounts() {
    plainCount.textContent = Bench.plural(plain.value.length, "character") + " in";
    entitiesCount.textContent = Bench.plural(entities.value.length, "character") + " escaped";
  }

  plain.addEventListener("input", fromPlain);
  entities.addEventListener("input", fromEntities);
  optAll.addEventListener("change", fromPlain);
  optStyle.addEventListener("change", fromPlain);

  $("#swap").addEventListener("click", function () {
    var a = plain.value, b = entities.value;
    plain.value = b;
    entities.value = a;
    updateCounts();
    Bench.toast("Swapped");
  });

  /* --- reference table ------------------------------------------------------ */

  function renderRef() {
    var q = searchBox.value.trim().toLowerCase();
    var rows = ENTITIES.filter(function (e) {
      if (!q) return true;
      var hay = (e.n + " " + e.cat + " " + e.dec + " " + e.hex).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    if (!rows.length) {
      refBody.innerHTML = '<tr><td colspan="4"><span class="empty">No entity matches "' + esc(searchBox.value) + '".</span></td></tr>';
      refCount.textContent = "0 of " + ENTITIES.length + " entities";
      return;
    }

    refBody.innerHTML = rows.map(function (e) {
      var blank = e.dec <= 32 || e.dec === 160;
      var chDisp = blank ? '<span class="he__ch he__ch--blank">(space)</span>' : '<span class="he__ch">' + esc(e.c) + "</span>";
      return "<tr>"
        + '<td class="he__cell" data-copy-text="' + esc(e.c) + '" title="Click to copy the character">' + chDisp + "</td>"
        + '<td class="he__cell mono" data-copy-text="&amp;' + esc(e.n) + ';" title="Click to copy &' + esc(e.n) + ';">&amp;' + esc(e.n) + ";</td>"
        + '<td class="he__cell num mono" data-copy-text="&amp;#' + e.dec + ';" title="Click to copy &#' + e.dec + ';">&amp;#' + e.dec + ";</td>"
        + '<td class="he__cell num mono" data-copy-text="&amp;#x' + e.hex + ';" title="Click to copy &#x' + e.hex + ';">&amp;#x' + e.hex + ";</td>"
        + "</tr>";
    }).join("");
    refCount.textContent = rows.length === ENTITIES.length
      ? ENTITIES.length + " entities"
      : rows.length + " of " + ENTITIES.length + " entities";
  }

  refBody.addEventListener("click", function (e) {
    var td = e.target.closest("[data-copy-text]");
    if (!td) return;
    Bench.copy(td.dataset.copyText);
  });

  Bench.live(searchBox, Bench.debounce(renderRef, 80));

  /* --- boot ------------------------------------------------------------- */

  plain.value = SAMPLE;
  fromPlain();
  renderRef();
});
</script>

</body>
</html>
